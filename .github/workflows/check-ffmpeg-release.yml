name: Check for new FFmpeg release

# Runs daily. Finds the highest-numbered release/<version> branch on the
# upstream FFmpeg repo (github.com/FFmpeg/FFmpeg) — e.g. release/7.1 — and
# compares its latest commit against what the ffmpeg-src submodule currently
# points at. If there's a newer commit (either a new release branch, or a new
# commit on the same branch), updates the submodule, commits that change,
# and tags this repo with the FFmpeg version — which triggers build.yml
# (via the tag push) to build and release binaries for that version.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find latest release branch upstream
        id: latest
        run: |
          # Upstream branches look like "release/7.1", "release/6.1", etc.
          # Pick the highest version number.
          latest_branch=$(git -C ffmpeg-src ls-remote --heads origin \
            | awk -F'refs/heads/' '{print $2}' \
            | grep -E '^release/[0-9]+\.[0-9]+$' \
            | sed 's#release/##' \
            | sort -V \
            | tail -n1)
          if [ -z "$latest_branch" ]; then
            echo "Could not determine latest release/* branch" >&2
            exit 1
          fi
          latest_sha=$(git -C ffmpeg-src ls-remote origin "refs/heads/release/${latest_branch}" | cut -f1)
          echo "version=$latest_branch" >> "$GITHUB_OUTPUT"
          echo "sha=$latest_sha" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release branch: release/${latest_branch} @ ${latest_sha}"

      - name: Check current submodule commit
        id: current
        run: |
          current_sha=$(git -C ffmpeg-src rev-parse HEAD)
          echo "sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "Current submodule commit: $current_sha"

      - name: Update submodule to latest release branch head
        if: steps.latest.outputs.sha != steps.current.outputs.sha
        run: |
          cd ffmpeg-src
          git fetch --depth 1 origin "refs/heads/release/${{ steps.latest.outputs.version }}"
          git checkout FETCH_HEAD

      # Verify every patch in patches/ still applies cleanly against the new
      # submodule commit BEFORE committing the bump. If a patch (e.g.
      # ddagrab-uac-recovery.patch) no longer applies, upstream changed the
      # surrounding code enough to need a manual rebase — fail here instead
      # of silently committing a submodule bump that build.yml would later
      # reject (or worse, silently ship unpatched if the check were ever
      # loosened on the Dockerfile side).
      - name: Verify source patches still apply
        if: steps.latest.outputs.sha != steps.current.outputs.sha
        run: |
          fail=0
          for patch in patches/*.patch; do
            [ -e "$patch" ] || continue
            echo "Checking $patch against release/${{ steps.latest.outputs.version }} (${{ steps.latest.outputs.sha }})..."
            if ! git -C ffmpeg-src apply --check "../$patch"; then
              echo "::error::$patch no longer applies cleanly to ffmpeg-src @ release/${{ steps.latest.outputs.version }}. Manual rebase required before this submodule bump can be merged." >&2
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Discarding submodule bump; patches need a manual rebase first." >&2
            git -C ffmpeg-src checkout "${{ steps.current.outputs.sha }}"
            exit 1
          fi

      - name: Commit and push submodule update
        if: steps.latest.outputs.sha != steps.current.outputs.sha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ffmpeg-src
          git commit -m "Update ffmpeg-src to release/${{ steps.latest.outputs.version }} (${{ steps.latest.outputs.sha }})"
          git push origin HEAD:${{ github.ref_name }}
          # Tag with the FFmpeg version so build.yml's tag-push trigger fires
          # and the release derives its name from this version. Re-running
          # against the same branch with new commits moves the tag forward.
          git tag -f "v${{ steps.latest.outputs.version }}"
          git push origin "v${{ steps.latest.outputs.version }}" --force
