name: Build ffmpeg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker/build.sh linux ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}

  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker/build.sh windows ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ matrix.arch }}
          path: dist/windows/${{ matrix.arch }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: dist/macos/arm64

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine release tag from ffmpeg-src version
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            base_tag="${{ github.ref_name }}"
          else
            # workflow_dispatch (or any non-tag trigger): derive the tag from
            # whatever version ffmpeg-src is currently checked out at, so the
            # release always reflects the FFmpeg version actually built.
            # Prefer an exact tag match, then FFmpeg's own RELEASE file
            # (e.g. "7.1" for a release branch checkout), then fall back to
            # the short commit hash.
            ffmpeg_ref=$(cd ffmpeg-src && ( \
              git describe --tags --exact-match 2>/dev/null \
              || (test -f RELEASE && cat RELEASE) \
              || git rev-parse --short HEAD \
            ))
            base_tag="v${ffmpeg_ref}"
          fi

          # Append the short SHA of this builder repo's commit that produced
          # the build, so a given FFmpeg version can be released more than
          # once (e.g. after a builder-side fix) without the tag colliding
          # with a previous release for the same FFmpeg version. Use HEAD
          # (not github.sha directly) since actions/checkout already left us
          # on the exact commit that triggered this run.
          builder_sha=$(git rev-parse --short HEAD)
          echo "tag=${base_tag}-${builder_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"

            # Full package: everything the build produced (bin, lib, include,
            # share — headers/import libs for development use, etc).
            (cd "$dir" && zip -r "../../release/${name}.zip" .)

            # Binary-only package: just bin/ (the ffmpeg executable, and on
            # Windows the DLLs that live alongside it), minus Windows .lib
            # import libraries which aren't needed to run ffmpeg. Drops
            # lib/, include/, share/ entirely — only needed for developing
            # against libav*, not for running ffmpeg.
            binary_only_dir="$(mktemp -d)/${name}"
            mkdir -p "$binary_only_dir"
            if [ -d "${dir}bin" ]; then
              cp -r "${dir}bin" "$binary_only_dir/"
              find "$binary_only_dir/bin" -maxdepth 1 -name '*.lib' -delete
            fi
            [ -f "${dir}SHA256SUMS.txt" ] && cp "${dir}SHA256SUMS.txt" "$binary_only_dir/"
            (cd "$(dirname "$binary_only_dir")" && zip -r "${GITHUB_WORKSPACE}/release/${name}-binary-only.zip" "$name")
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: release/*.zip
          generate_release_notes: true

