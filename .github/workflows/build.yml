name: Build ffmpeg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker/build.sh linux ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}

  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker/build.sh windows ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ matrix.arch }}
          path: dist/windows/${{ matrix.arch }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: dist/macos/arm64

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
