name: Build ffmpeg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker/build.sh linux ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}

  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker/build.sh windows ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ matrix.arch }}
          path: dist/windows/${{ matrix.arch }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: dist/macos/arm64

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine release tag from ffmpeg-src version
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch (or any non-tag trigger): derive the tag from
            # whatever version ffmpeg-src is currently checked out at, so the
            # release always reflects the FFmpeg version actually built.
            # Prefer an exact tag match, then FFmpeg's own RELEASE file
            # (e.g. "7.1" for a release branch checkout), then fall back to
            # the short commit hash.
            ffmpeg_ref=$(cd ffmpeg-src && ( \
              git describe --tags --exact-match 2>/dev/null \
              || (test -f RELEASE && cat RELEASE) \
              || git rev-parse --short HEAD \
            ))
            echo "tag=v${ffmpeg_ref}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: release/*.zip
          generate_release_notes: true

